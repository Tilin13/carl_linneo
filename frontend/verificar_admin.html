
<h2>Verificación de administrador</h2>

<p>Introduce el código de seis cifras de tu aplicación autenticadora.</p>

<form method="POST" action="{{ url_for('verificar_admin') }}">
    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <label for="codigo">Código de autenticación</label>

    <input
        type="text"
        id="codigo"
        name="codigo"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        autocomplete="one-time-code"
        required
    >

    <button type="submit">Verificar y entrar</button>
</form>
