
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Linneo - Chatbox</title>

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="icon" type="image/png" href="/linneo_isotipo.png">

    <!-- Conserva esta línea solo si tu aplicación utiliza Flask-WTF -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>

<body>

    <!-- HEADER -->
    <header class="barra" id="barra_global">

        <h2>Linneo</h2>

        <button class="button" id="buscarbtn" type="button">
            🔍︎
        </button>

        <button class="button" id="carritobtn" type="button">
            🛒
        </button>

        <div id="carrito_productos">
            <h5 id="cantidad_productos"></h5>
        </div>

        <button class="button" id="favoritos_btn" type="button">
            Favoritos
        </button>

        <button class="button" id="menubtn" type="button">
            ☰
        </button>

        <button class="button" id="iniciar_secion_btn" type="button">
            Iniciar sesión
        </button>

        <button class="button" id="registrarse_btn" type="button">
            Registrarse
        </button>

        <div id="busqueda_div">
            <form action="/buscar" method="GET">

                <input
                    type="search"
                    id="barra_busqueda"
                    name="busqueda"
                    placeholder="Buscar productos..."
                    autocomplete="off"
                >

                <button class="button" type="submit">
                    Buscar
                </button>

            </form>
        </div>

    </header>


<!-- CHATBOX -->
<nav class="barra" id="configuraciones_bar_chatbox">
    <button
        id="idioma_chatboxbtn"
        class="button"
        type="button"
        aria-label="Cambiar idioma"
    >
        🌐
    </button>
</nav>

<!-- VENTANA DEL CHAT -->
<section
    id="chat_box"
    aria-label="Asistente virtual Linneo"
    aria-hidden="true"
    hidden
>
    <!-- ENCABEZADO -->
    <header class="chat_encabezado">

        <div class="chat_identidad">

            <div class="chat_avatar">
                <span>🌿</span>
            </div>

            <div class="chat_info">
                <h2>Linneo</h2>
                <span>
                    <span class="estado_online"></span>
                    Asistente virtual
                </span>
            </div>

        </div>

        <button
            type="button"
            id="chat_cerrar_btn"
            class="chat_cerrar"
            aria-label="Cerrar chat"
        >
            ✕
        </button>

    </header>

    <!-- HISTORIAL -->
    <div
        id="historial_mensajes"
        aria-live="polite"
        aria-relevant="additions"
        aria-label="Conversación"
    >

        <div class="mensaje_asistente">
            ¡Hola! Soy el asistente virtual de Linneo. 🌿
            ¿Qué producto estás buscando?
        </div>

    </div>

    <!-- FORMULARIO -->
    <form id="form_chat">

        <input
            type="text"
            id="bar_mensajes"
            placeholder="Escribe tu mensaje..."
            maxlength="4000"
            autocomplete="off"
            aria-label="Escribe tu mensaje"
            required
        >

        <button
            type="submit"
            id="enviar_mensaje_btn"
            aria-label="Enviar mensaje"
        >
            ➤
        </button>

    </form>

</section>

<!-- BOTÓN FLOTANTE -->
<button
    id="chat_btn"
    class="button"
    type="button"
    aria-label="Abrir o cerrar el chat"
    aria-expanded="false"
>
    💬
</button>


    <!-- CARRITO -->
    <nav class="barra" id="carrito_bar">

        <h1>CARRITO</h1>

        <div id="mostrar_productos">

            <h3>Producto</h3>
            <h3 id="contenido_carrito"></h3>

            <h3>Precio</h3>
            <h3 id="productos_carrito_precio"></h3>

        </div>

        <div>
            <h2>Descuentos</h2>
            <h2>Subtotal</h2>
        </div>

        <button
            class="button"
            type="button"
            id="comprar_carrito_btn"
        >
            Comprar
        </button>

    </nav>


    <!-- MENÚ -->
    <nav class="barra" id="menu_bar">

        <button
            id="atras_menu"
            type="button"
            class="button"
        >
            ↚
        </button>

        <div>
            <a class="text_menu" href="/catalogo">
                Catálogo
            </a>
        </div>

        <div>
            <a class="text_menu" href="/contacto">
                Contáctanos
            </a>
        </div>

        <div>
            <a class="text_menu" href="/informacion">
                ¿Quiénes somos?
            </a>
        </div>

    </nav>


    <script src="/js/main.js"></script>

</body>
</html>
