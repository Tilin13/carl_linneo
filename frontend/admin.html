	<!DOCTYPE html>
	<html lang="es">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport"
      content="width=device-width, initial-scale=1">

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		>

		<title>Linneo</title>

		<link rel="stylesheet" href="/css/variables.css">
	
		<link
			rel="icon"
			type="image/png"
			href="linneo_isotipo.png"
		>
	</head>



	<body>

		<header class="barra" id="barra_global">

			<h2>Linneo</h2>


			<button
				class="button"
				id="buscarbtn"
				type="button"
			>
				🔍︎
			</button>

			<button
				class="button"
				id="carritobtn"
				type="button"
			>
				🛒
			</button>
			<div id="carrito_productos" >
				<h5 id="cantidad_productos"></h5>
			</div>
			<button 
				class="button"
				id="favoritos_btn"
				type="button"
			>♡
			</button>

			<button
				class="button"
				id="menubtn"
				type="button"
			>
				☰
			</button>
			{% if current_user.is_authenticated %}
  <span>Hola, {{ current_user.username }}</span>

  <form action="{{ url_for('cerrar_sesion') }}" method="POST">
    <input type="hidden" name="csrf_token"
           value="{{ csrf_token() }}">
    <button type="submit">Cerrar sesión</button>
  </form>
{% else %}
  <a href="{{ url_for('login') }}">Iniciar sesión</a>
  <a href="{{ url_for('registrarse') }}">Registrarse</a>
{% endif %}
			<div id="busqueda_div">
				<form action="/buscar" method="GET">

				<input
					type="search"
					id="barra_busqueda"
					name="busqueda"
					placeholder="Buscar productos..."
					autocomplete="off"
				>

				<button
					class="button"
					type="submit"
				>
					Buscar
				</button>
			</form>
			

			</div>
			

		</header>

		<main>

			<div id="tarjeta_logo">
				<img
				src="tarjeta2.png"
				alt="tarjeta"
				>
			
			</div>
			
			<h1>Inventario</h1>
			<section id="inventario_section">
			</section>
			<form id="modificar_inv" method="POST">
				<input id="codigo" placeholder="Código" type="text">
				<input id="nombre" placeholder="Nombre" type="text">
				<input id="categoria" placeholder="Categoria" type="text">
				<input id="precio_compra" placeholder="Precio de compra" type="number">
				<input id="precio_manofactura" placeholder="Precio de producción" type="number">
				<input id="precio_venta" placeholder="Precio de venta" type="number">
				<input id="stock" placeholder="Stock" type="number">
				<button id="enviar" type="sumnit">Guardar</button>
			</form>
			<h1>Añadir stock</h1>
			<input type="text" id="producto_codigo" placeholder="Código del producto">
			<input type="number" id="cantidad_producto" placeholder="Cantidad a añadir">
			<section id="clientes_section">
			</section>
			

		<script src="/js/main.js"></script>

	</body>

	</html>
