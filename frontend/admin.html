<html>
<head>
	<meta charset="utf-8">
	<title>admin</title>
</head>
<body>
<h1>Inventario</h1>

<p id="mensaje_admin" role="status"></p>

<section id="inventario_section">
    <!-- main.js cargará aquí los productos -->
</section>

<h2 id="titulo_formulario">Añadir producto</h2>

<form id="modificar_inv">
    <input
        type="hidden"
        id="codigo_original"
        value=""
    >

    <label for="codigo">Código</label>
    <input
        id="codigo"
        type="text"
        maxlength="80"
        required
    >

    <label for="nombre">Nombre</label>
    <input
        id="nombre"
        type="text"
        maxlength="200"
        required
    >

    <label for="categoria">Categoría</label>
    <input
        id="categoria"
        type="text"
        maxlength="100"
        required
    >

    <label for="precio_compra">Precio de compra</label>
    <input
        id="precio_compra"
        type="number"
        min="0"
        step="0.01"
        required
    >

    <label for="precio_manofactura">
        Precio de producción
    </label>
    <input
        id="precio_manofactura"
        type="number"
        min="0"
        step="0.01"
        required
    >

    <label for="precio_venta">Precio de venta</label>
    <input
        id="precio_venta"
        type="number"
        min="0"
        step="0.01"
        required
    >

    <label for="stock">Stock</label>
    <input
        id="stock"
        type="number"
        min="0"
        step="1"
        required
    >

    <button type="submit">Guardar producto</button>
    <button type="button" id="cancelar_edicion">
        Cancelar
    </button>
</form>

<h2>Añadir stock</h2>

<form id="form_stock">
    <label for="producto_codigo">
        Código del producto
    </label>
    <input id="producto_codigo" required>

    <label for="cantidad_producto">
        Unidades a añadir
    </label>
    <input
        id="cantidad_producto"
        type="number"
        min="1"
        step="1"
        required
    >

    <button type="submit">Añadir unidades</button>
</form>

<h2>Usuarios registrados</h2>

<section id="clientes_section">
    <!-- main.js cargará aquí los usuarios -->
</section>

<script src="{{ url_for('static', filename='js/main.js') }}"
        defer></script>
</body>
