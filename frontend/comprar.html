	<!DOCTYPE html>
	<html lang="es">

	<head>
		<meta charset="UTF-8">

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		>

		<title>Linneo</title>

		<link rel="stylesheet" href="/css/variables.css">
	</head>

	<body>

		<header class="barra" id="barra_global">

			<h2>Linneo</h2>


			<button
				class="button"
				id="buscarbtn"
				type="button"
			>
				🔍︎
			</button>

			<button
				class="button"
				id="carritobtn"
				type="button"
			>
				🛒
			</button>

			<button
				class="button"
				id="menubtn"
				type="button"
			>
				☰
			</button>
			
			<div id="busqueda_div">
				<form action="/buscar" method="GET">

				<input
					type="search"
					id="barra_busqueda"
					name="busqueda"
					placeholder="Buscar productos..."
					autocomplete="off"
				>

				<button
					class="button"
					type="submit"
				>
					Buscar
				</button>

			</form>

			</div>
			

		</header>

		<main>

			<div id="tarjeta_logo">
			</div>

		</main>
		<nav id="novedades_bar">
			<h1>NOVEDADES</h1>
			<button id="atras_novedades"></button>
			<button id="adelante_novedades"></button>
			<div>
				<img
				src="novedad/novedades_hoy.jpg"
				alt="novedad_hoy"
				>
			</div>
		</nav>
		<nav class="barra" id="carrito_bar">
			<h1>CARRITO</h1>
			<div>
				<h2>Subtotal</h2>
			</div>
			<button class="button" type="button" id="comprar_carrito_btn">
				Comprar
			</button>
			
				
		</nav>

		<nav class="barra" id="menu_bar">

			<button
				id="atras_menu"
				type="button"
				class="button"
			>
				↚
			</button>
			<div>
				<a
					class="text_menu"
					href="/catalogo"
				>
					Catálogo
				</a>
			</div>
			<div>
				<a
					class="text_menu"
					href="#contacto"
				>
					Contáctanos
				</a>
			</div>
			<div>
				<a
					class="text_menu"
					href="/informacion"
				>
					¿Quiénes somos?
				</a>
			</div>

		</nav>

		<script src="/js/main.js"></script>

	</body>

	</html>
