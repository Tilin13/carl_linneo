
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="csrf-token" content="{{ csrf_token() }}">

    <title>Caja | Linneo</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/variables.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin.css') }}">

    <script src="{{ url_for('static', filename='js/caja.js') }}"
            defer></script>
</head>

<body>

<main class="admin-pagina">

    <header class="admin-encabezado">
        <div>
            <p class="admin-etiqueta">LINNEO · PUNTO DE VENTA</p>
            <h1>Sistema de caja</h1>
            <p>Registra ventas y asocia compradores registrados.</p>
        </div>
    </header>

    <section class="tarjeta">

        <h2>1. Seleccionar comprador</h2>

        <input
            type="search"
            id="buscar_comprador"
            placeholder="Buscar por usuario o correo..."
        >

        <select id="comprador" required>
            <option value="">Cargando compradores...</option>
        </select>

        <p id="datos_comprador"></p>

    </section>

    <section class="tarjeta">

        <h2>2. Productos</h2>

        <div>
            <select id="producto">
                <option value="">Seleccionar producto...</option>
            </select>

            <input
                type="number"
                id="cantidad"
                min="1"
                value="1"
                placeholder="Cantidad"
            >

            <button type="button" id="agregar_producto">
                Agregar producto
            </button>
        </div>

        <div style="overflow-x:auto;">

            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Unitario</th>
                        <th>Total</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="lista_productos">
                    <tr>
                        <td colspan="5">No hay productos agregados.</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </section>

    <section class="tarjeta">

        <h2>3. Resumen de compra</h2>

        <p>
            Subtotal:
            <strong id="subtotal">$0.00</strong>
        </p>

        <label for="descuento">
            Descuento (%)
        </label>

        <input
            type="number"
            id="descuento"
            min="0"
            max="100"
            step="0.01"
            value="0"
        >

        <p>
            Descuento aplicado:
            <strong id="descuento_total">$0.00</strong>
        </p>

        <h2>
            Total:
            <span id="total">$0.00</span>
        </h2>

    </section>

    <section class="tarjeta">

        <h2>4. Método de pago</h2>

        <select id="metodo_pago">
            <option value="efectivo">Efectivo</option>
        </select>

        <button
            type="button"
            id="terminar_pago"
            class="button"
        >
            Confirmar venta
        </button>

        <p id="mensaje_caja" role="status"></p>

    </section>

</main>

</body>
</html>
